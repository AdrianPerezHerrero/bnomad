name: Installed package
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      HDPGPC_TEST_INSTALLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel and source archive
        run: |
          python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
          python -m build
          python -m twine check dist/*
          python tools/check_artifacts.py dist
      - name: Install noneditably in a fresh environment
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import venv

          environment = Path(os.environ['RUNNER_TEMP']) / 'clean'
          venv.EnvBuilder(with_pip=True).create(environment)
          scripts = environment / ('Scripts' if os.name == 'nt' else 'bin')
          python = str(scripts / ('python.exe' if os.name == 'nt' else 'python'))
          subprocess.check_call([python, '-m', 'pip', 'install', '--upgrade', 'pip'])
          # Release gates run on CPU; avoid downloading/installing CUDA libraries.
          subprocess.check_call([python, '-m', 'pip', 'install', '--no-cache-dir',
                                 'torch==2.9.0', '--index-url',
                                 'https://download.pytorch.org/whl/cpu'])
          wheels = list(Path('dist').glob('*.whl'))
          if len(wheels) != 1:
              raise RuntimeError('Expected exactly one built wheel')
          subprocess.check_call([python, '-m', 'pip', 'install', '--no-cache-dir',
                                 str(wheels[0].resolve())])
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as path:
              path.write(str(scripts) + '\n')
      - name: Unpack source archive outside checkout
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil

          archives = list(Path('dist').glob('*.tar.gz'))
          if len(archives) != 1:
              raise RuntimeError('Expected exactly one built source archive')
          destination = Path(os.environ['RUNNER_TEMP']) / 'source'
          destination.mkdir(parents=True, exist_ok=False)
          shutil.unpack_archive(str(archives[0].resolve()), str(destination))
          roots = list(destination.iterdir())
          if len(roots) != 1 or not roots[0].is_dir():
              raise RuntimeError('Expected one source archive root directory')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('HDPGPC_SOURCE=' + str(roots[0].resolve()) + '\n')
      - name: Installed examples and complete regression suite
        run: |
          unset PYTHONPATH
          cd "$HDPGPC_SOURCE"
          hdpgpc-reference --mode online --output online.json
          python tools/verify_installed.py --output "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/source/**/*json
            ${{ runner.temp }}/evidence/*
            dist/*

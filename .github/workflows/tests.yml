name: Installed package
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      HDPGPC_TEST_INSTALLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel and source archive
        run: |
          python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
          python -m build
          python -m twine check dist/*
          python tools/check_artifacts.py dist
      - name: Install noneditably in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          if [ "$RUNNER_OS" = Windows ]; then
            echo "$RUNNER_TEMP/clean/Scripts" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/clean/Scripts/python" -m pip install dist/*.whl
          else
            echo "$RUNNER_TEMP/clean/bin" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/clean/bin/python" -m pip install dist/*.whl
          fi
      - name: Unpack source archive outside checkout
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/source" --strip-components=1
      - name: Installed examples and complete regression suite
        run: |
          unset PYTHONPATH
          cd "$RUNNER_TEMP/source"
          hdpgpc-reference --mode online --output online.json
          python tools/verify_installed.py --output "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/source/*json
            ${{ runner.temp }}/evidence/*
            dist/*

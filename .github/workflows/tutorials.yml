name: Public tutorials
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tutorials/**'
      - 'examples/colab_setup.py'
      - 'examples/tutorial_utils.py'
      - 'tools/*tutorials.py'
      - 'hdpgpc/hdpgpc/**'
      - 'pyproject.toml'
      - '.github/workflows/tutorials.yml'
jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Install CPU package and notebook tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[tutorials]'
      - name: Execute every notebook twice
        run: python tools/validate_tutorials.py --output tutorials/.validation/ci
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: executed-tutorials
          path: tutorials/.validation/ci
          include-hidden-files: true
